<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Evaluación viernes 4 sept • English</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fredoka:wght@600;700&display=swap');
    :root{--ink:#102a43;--muted:#60758a;--cream:#fffaf0;--paper:#fff;--coral:#ff7163;--sun:#ffc857;--sky:#57b7dc;--green:#3bb98c;--purple:#8c78d6;--shadow:0 15px 40px #163b5d1c}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;min-height:100vh} button{font:inherit}
    .top{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:24px max(20px,calc((100vw - 1100px)/2)) 76px}.top:after{content:"";position:absolute;left:-3%;right:-3%;bottom:-42px;height:82px;background:var(--cream);border-radius:50% 50% 0 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}.back{color:#d9e8f3;text-decoration:none;font-size:.88rem}.brand{font:700 .82rem Fredoka;letter-spacing:.12em}.sound-note{border:1px solid #ffffff35;border-radius:99px;padding:8px 13px;color:#d9e8f3;font-size:.78rem}.hero{max-width:800px;margin:58px auto 0;text-align:center;position:relative;z-index:1}.eyebrow{color:var(--sun);font-size:.76rem;font-weight:700;letter-spacing:.18em}.hero h1{font:700 clamp(2.5rem,7vw,5rem)/.98 Fredoka;margin:13px 0 16px}.hero p{color:#d9e8f3;max-width:570px;margin:auto;line-height:1.6}.hero-icons{font-size:2rem;letter-spacing:.4em;margin-top:22px}
    main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}.dashboard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin:8px 0 30px}.dashboard h2{font:700 1.45rem Fredoka;margin:0 0 4px}.dashboard p{margin:0;color:var(--muted);font-size:.9rem}.score{display:flex;gap:9px}.score span{background:#fff;border-radius:14px;padding:10px 15px;box-shadow:var(--shadow);font-size:.8rem;color:var(--muted)}.score b{display:block;color:var(--ink);font:700 1.15rem Fredoka}
    .topics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.topic{border:0;background:#fff;text-align:left;border-radius:22px;padding:20px;box-shadow:var(--shadow);cursor:pointer;border-top:5px solid var(--accent);transition:.2s transform}.topic:hover,.topic.active{transform:translateY(-5px)}.topic.active{outline:3px solid color-mix(in srgb,var(--accent),white 45%)}.topic .icon{font-size:2rem}.topic b{display:block;font:700 1.12rem Fredoka;margin-top:12px}.topic small{color:var(--muted)}
    .panel{margin-top:24px;background:#fff;border-radius:28px;padding:clamp(20px,4vw,38px);box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:end;border-bottom:1px solid #e9eff4;padding-bottom:22px}.panel h2{font:700 clamp(1.55rem,4vw,2.2rem) Fredoka;margin:0}.panel-head p{margin:6px 0 0;color:var(--muted)}.listen-tip{white-space:nowrap;color:#42637d;background:#edf7fb;border-radius:99px;padding:9px 13px;font-size:.78rem}.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}.word{border:2px solid #e6edf2;background:#fff;border-radius:17px;padding:16px 12px;text-align:center;cursor:pointer;transition:.18s}.word:hover,.word.speaking{border-color:var(--accent);background:color-mix(in srgb,var(--accent),white 93%);transform:translateY(-2px)}.word .emoji{display:block;font-size:1.65rem}.word strong{display:block;font:700 1.05rem Fredoka;margin:7px 0 2px}.word small{color:var(--muted)}.word .speaker{font-size:.72rem;color:var(--accent);display:block;margin-top:8px;font-weight:700}
    .challenge{margin-top:28px;border-radius:22px;background:#f5f8fa;padding:24px}.challenge-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.challenge label{font-size:.72rem;letter-spacing:.15em;color:var(--purple);font-weight:700}.progress{font-size:.8rem;color:var(--muted)}.challenge h3{font:700 1.35rem Fredoka;margin:12px 0 18px}.challenge h3 .say{border:0;background:none;color:var(--sky);cursor:pointer;font-size:1.2rem}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option{border:2px solid #dfe8ee;background:#fff;border-radius:14px;padding:13px;cursor:pointer;font-weight:700}.option:hover{border-color:var(--sky)}.option.correct{background:#e8faf3;border-color:var(--green);color:#16815f}.option.wrong{background:#fff0ee;border-color:var(--coral);color:#c5483d}.feedback{min-height:24px;margin:14px 0 0;font-weight:700}.next{display:none;margin:8px 0 0 auto;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:11px 19px;cursor:pointer}.next.show{display:block}.done{text-align:center;padding:25px}.done span{font-size:3rem}.done h3{font:700 1.8rem Fredoka;margin:8px}.done button{border:0;background:var(--coral);color:#fff;border-radius:99px;padding:12px 20px;cursor:pointer}
    @media(max-width:760px){.topics{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr}.sound-note{display:none}.panel-head{display:block}.listen-tip{display:inline-block;margin-top:12px}.options{grid-template-columns:1fr}.hero{margin-top:40px}.top{padding-bottom:65px}}
    @media(max-width:420px){.topics{grid-template-columns:1fr}.score{justify-content:space-between}.score span{flex:1}.hero h1{font-size:2.55rem}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav"><a class="back" href="../index.html">← Volver a juegos</a><span class="brand">VICKY · ENGLISH CLUB</span><span class="sound-note">🔊 Haz clic y escucha</span></nav><div class="hero"><div class="eyebrow">ENGLISH · VOCABULARY REVIEW</div><h1>Evaluación<br>viernes 4 sept</h1><p>Explora las palabras, escucha su pronunciación en inglés y completa los desafíos de cada tema.</p><div class="hero-icons">☀️ 🍂 🧥 📅</div></div></header>
  <main><section class="dashboard"><div><h2>Choose a topic</h2><p>Elige un tema para estudiar y jugar.</p></div><div class="score"><span>Aciertos<b id="hits">0</b></span><span>Completados<b id="finished">0 / 4</b></span></div></section><div class="topics" id="topics"></div><section class="panel" id="panel"></section></main>
  <script>
    const topics=[
      {id:'weather',name:'Weather',es:'El clima',icon:'☀️',color:'#ff9f43',words:[['Sunny','soleado','☀️'],['Cloudy','nublado','☁️'],['Rainy','lluvioso','🌧️'],['Windy','ventoso','🌬️'],['Snowy','nevado','🌨️'],['Hot','caluroso','🌡️'],['Cold','frío','🥶']]},
      {id:'seasons',name:'Seasons of the year',es:'Estaciones del año',icon:'🍂',color:'#3bb98c',words:[['Spring','primavera','🌸'],['Summer','verano','🏖️'],['Fall','otoño','🍂'],['Winter','invierno','⛄']]},
      {id:'clothes',name:'Clothes',es:'Ropa',icon:'🧥',color:'#8c78d6',words:[['T-shirt','polera','👕'],['Pants','pantalones','👖'],['Dress','vestido','👗'],['Skirt','falda','🪭'],['Jacket','chaqueta','🧥'],['Coat','abrigo','🧥'],['Shoes','zapatos','👟'],['Boots','botas','🥾'],['Hat','sombrero / gorro','👒'],['Scarf','bufanda','🧣']]},
      {id:'days',name:'Days of the week',es:'Días de la semana',icon:'📅',color:'#57b7dc',words:[['Monday','lunes','1️⃣'],['Tuesday','martes','2️⃣'],['Wednesday','miércoles','3️⃣'],['Thursday','jueves','4️⃣'],['Friday','viernes','5️⃣'],['Saturday','sábado','6️⃣'],['Sunday','domingo','7️⃣']]}
    ];
    let active=0,q=0,hits=0,answered=false;const completed=new Set();
    const shuffled=a=>[...a].sort(()=>Math.random()-.5);
    function speak(text,button){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;button?.classList.add('speaking');u.onend=()=>button?.classList.remove('speaking');speechSynthesis.speak(u)}
    function renderTopics(){document.querySelector('#topics').innerHTML=topics.map((t,i)=>`<button class="topic ${i===active?'active':''}" style="--accent:${t.color}" data-i="${i}"><span class="icon">${t.icon}</span><b>${t.name}</b><small>${t.es} · ${t.words.length} palabras</small></button>`).join('');document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{active=+b.dataset.i;q=0;answered=false;render()})}
    function question(t){const item=t.words[q%t.words.length],choices=shuffled([item[1],...shuffled(t.words.filter(w=>w!==item)).slice(0,2).map(w=>w[1])]);return `<div class="challenge"><div class="challenge-top"><label>MINI CHALLENGE</label><span class="progress">${q+1} de ${t.words.length}</span></div><h3>¿Qué significa <strong>${item[0]}</strong>? <button class="say" aria-label="Escuchar ${item[0]}" data-say="${item[0]}">🔊</button></h3><div class="options">${choices.map(x=>`<button class="option" data-value="${x}">${x}</button>`).join('')}</div><p class="feedback" role="status"></p><button class="next">${q===t.words.length-1?'Terminar tema':'Siguiente →'}</button></div>`}
    function render(){const t=topics[active];renderTopics();document.querySelector('#panel').style.setProperty('--accent',t.color);document.querySelector('#panel').innerHTML=`<div class="panel-head"><div><h2>${t.icon} ${t.name}</h2><p>${t.es} · Toca una tarjeta para escuchar.</p></div><span class="listen-tip">🔊 Pronunciación en inglés</span></div><div class="words">${t.words.map(w=>`<button class="word" data-say="${w[0]}" aria-label="Escuchar pronunciación de ${w[0]}"><span class="emoji">${w[2]}</span><strong>${w[0]}</strong><small>${w[1]}</small><span class="speaker">🔊 LISTEN</span></button>`).join('')}</div>${question(t)}`;bind()}
    function bind(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say,b)});document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const t=topics[active],right=t.words[q][1],ok=b.dataset.value===right;b.classList.add(ok?'correct':'wrong');if(ok)hits++;else document.querySelectorAll('.option').forEach(x=>{if(x.dataset.value===right)x.classList.add('correct')});document.querySelector('.feedback').textContent=ok?'✓ Excellent! ¡Respuesta correcta!':`✦ La respuesta correcta es “${right}”.`;document.querySelector('.next').classList.add('show');updateScore()});document.querySelector('.next').onclick=()=>{const t=topics[active];if(q===t.words.length-1){completed.add(t.id);updateScore();document.querySelector('.challenge').innerHTML=`<div class="done"><span>🌟</span><h3>Topic complete!</h3><p>¡Terminaste ${t.name}!</p><button id="again">Practicar otra vez</button></div>`;document.querySelector('#again').onclick=()=>{q=0;answered=false;render()}}else{q++;answered=false;render()}}}
    function updateScore(){document.querySelector('#hits').textContent=hits;document.querySelector('#finished').textContent=`${completed.size} / 4`}
    render();
  </script>
</body>
</html>
