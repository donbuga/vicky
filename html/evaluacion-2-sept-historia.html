<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evaluación 2 de sept · Historia</title>
  <style>
    :root{--navy:#12355b;--blue:#1676b8;--red:#dc3d4b;--cream:#fffaf0;--gold:#ffd166;--green:#348f62}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:var(--navy);font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(150deg,#bfe5ff,#fff5d3 50%,#ffc8cb)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#fff 3px,transparent 4px);background-size:32px 32px}
    button{font:inherit}.app{position:relative;max-width:960px;margin:auto}.top{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 18px}.badge{display:grid;place-items:center;width:105px;height:105px;border:5px solid white;border-radius:50%;background:linear-gradient(#fff 50%,#df3444 50%);font-size:3.4rem;box-shadow:0 9px 22px #12355b30}.top h1{margin:0;font-size:clamp(1.8rem,5vw,3.3rem);line-height:1;color:#143d6b}.subtitle{margin:.5rem 0 0;font-weight:900;color:#a42635}
    .card{background:#fffaf0f2;border:4px solid white;border-radius:30px;box-shadow:0 18px 45px #143d6b30;padding:clamp(18px,4vw,34px)}.status{display:flex;align-items:center;gap:12px}.score{white-space:nowrap;background:#fff0ad;border-radius:99px;padding:9px 14px;font-weight:900}.track{height:16px;flex:1;overflow:hidden;border-radius:99px;background:#d8e4ed}.bar{height:100%;width:0;background:linear-gradient(90deg,#1676b8,#dc3d4b);transition:width .35s}.topic{display:inline-block;margin:20px 0 7px;padding:7px 13px;border-radius:99px;background:#dceeff;color:#145f93;font-weight:900}.visual{display:grid;place-items:center;min-height:120px;margin:4px 0 12px;border-radius:20px;background:linear-gradient(135deg,#eaf7ff,#fff3cb);font-size:4.8rem;overflow:hidden}.visual img{width:100%;height:180px;object-fit:contain;padding:8px}.question{margin:10px 0 22px;text-align:center;font-size:clamp(1.35rem,4vw,2rem);line-height:1.2}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.answer{min-height:75px;padding:12px;border:3px solid #a9cce1;border-radius:18px;background:white;color:var(--navy);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #8db7d0;transition:.15s}.answer:hover:not(:disabled),.answer:focus-visible{transform:translateY(-3px);border-color:var(--blue);outline:none}.answer.correct{background:#d9f5df;border-color:#48a965;box-shadow:0 5px 0 #48a965}.answer.wrong{background:#ffe0e0;border-color:var(--red);box-shadow:0 5px 0 #c83b47}.answer:disabled{cursor:default}.feedback{min-height:34px;margin:20px 0 7px;text-align:center;font-size:1.14rem;font-weight:900}.next,.restart{display:none;margin:10px auto 0;padding:13px 25px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--blue),var(--red));color:white;font-weight:900;font-size:1.08rem;cursor:pointer;box-shadow:0 6px 0 #173e62}.next.show,.restart.show{display:block}.finish{display:none;text-align:center}.finish.show{display:block}.finish h2{font-size:clamp(2rem,6vw,3.3rem);margin:8px}.result{font-size:1.3rem;font-weight:800}.legend{text-align:center;margin-top:15px;color:#365e78;font-weight:800}.sources{font-size:.75rem;text-align:center;margin:18px 0;color:#4f6573}.sources a{color:#245e87}
    @media(max-width:620px){body{padding:10px}.top{gap:10px}.badge{width:76px;height:76px;font-size:2.5rem}.answers{grid-template-columns:1fr}.answer{min-height:62px}.card{border-radius:22px}.status{flex-wrap:wrap}.track{order:3;flex-basis:100%}.visual{min-height:95px}.visual img{height:135px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="badge" aria-hidden="true">⭐</div><div><h1>Evaluación 2 de sept</h1><p class="subtitle">Un viaje por Chile y el mundo · Historia 🇨🇱</p></div></header>
  <section class="card" id="game" aria-live="polite">
    <div class="status"><span class="score" id="score">⭐ 0 puntos</span><div class="track" aria-label="Progreso"><div class="bar" id="bar"></div></div><strong id="count">1 / 32</strong></div>
    <div class="topic" id="topic"></div><div class="visual" id="visual" aria-hidden="true"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Siguiente ➜</button>
  </section>
  <section class="card finish" id="finish"><div style="font-size:5rem">🏆🇨🇱</div><h2>¡Gran viaje!</h2><p class="result" id="result"></p><button class="restart show" id="restart">Jugar otra vez</button></section>
  <p class="legend">Lee con calma, observa la pista y elige la mejor respuesta.</p>
  <p class="sources">Imágenes educativas: <a href="https://commons.wikimedia.org/wiki/File:Flag_of_Chile.svg">bandera</a>, <a href="https://commons.wikimedia.org/wiki/File:Coat_of_arms_of_Chile.svg">escudo</a> y <a href="https://commons.wikimedia.org/wiki/File:Gabriela_Mistral-01.jpg">Gabriela Mistral</a>, vía Wikimedia Commons.</p>
</main><script>
const commons=name=>`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(name)}?width=700`;
const questions=[
 ["Símbolos patrios","¿Qué colores tiene la bandera de Chile?",["Azul, blanco y rojo","Verde, amarillo y azul","Rojo y amarillo","Blanco y verde"],0,"Sus colores son azul, blanco y rojo.",commons("Flag of Chile.svg")],
 ["Símbolos patrios","¿Cuántas estrellas tiene la bandera chilena?",["Una","Dos","Cinco","Ninguna"],0,"Tiene una estrella blanca en el cuadro azul.",commons("Flag of Chile.svg")],
 ["Símbolos patrios","¿Qué animales aparecen en el escudo nacional?",["Un huemul y un cóndor","Un puma y un zorro","Dos caballos","Una llama y un pingüino"],0,"El huemul y el cóndor sostienen el escudo.",commons("Coat of arms of Chile.svg")],
 ["Hechos relevantes","¿Qué héroe participó en el Combate Naval de Iquique?",["Arturo Prat","Pablo Neruda","Cristóbal Colón","Pedro de Valdivia"],0,"Arturo Prat comandó la corbeta Esmeralda.","⚓"],
 ["Hechos relevantes","¿En qué fecha recordamos el Combate Naval de Iquique?",["21 de mayo","18 de septiembre","12 de octubre","12 de febrero"],0,"Ocurrió el 21 de mayo de 1879.","🗓️"],
 ["Hechos relevantes","¿Qué ocurrió el 18 de septiembre de 1810?",["La Primera Junta de Gobierno","La fundación de Santiago","El encuentro de dos mundos","El Combate Naval de Iquique"],0,"Ese día se formó la Primera Junta Nacional de Gobierno.","🏛️"],
 ["Hechos relevantes","¿Quién fundó Santiago en 1541?",["Pedro de Valdivia","Bernardo O’Higgins","Arturo Prat","Pablo Neruda"],0,"Pedro de Valdivia fundó Santiago del Nuevo Extremo.","⛰️"],
 ["Hechos relevantes","El encuentro de dos mundos recuerda la llegada de Cristóbal Colón a América. ¿En qué año fue?",["1492","1810","1879","1541"],0,"Colón llegó a América en 1492.","⛵"],
 ["Personajes históricos","¿Quién fue Director Supremo y participó en la independencia de Chile?",["Bernardo O’Higgins","Cristóbal Colón","Pablo Neruda","Arturo Prat"],0,"Bernardo O’Higgins fue un líder de la independencia.","🎖️"],
 ["Personajes históricos","¿Quién fue un navegante que llegó a América en 1492?",["Cristóbal Colón","Pedro de Valdivia","Arturo Prat","Bernardo O’Higgins"],0,"Cristóbal Colón cruzó el océano Atlántico.","🧭"],
 ["Personajes históricos","¿Quién fue una poeta chilena y la primera persona latinoamericana en recibir el Nobel de Literatura?",["Gabriela Mistral","Violeta Parra","Arturo Prat","Pedro de Valdivia"],0,"Gabriela Mistral recibió el Nobel de Literatura en 1945.",commons("Gabriela Mistral-01.jpg")],
 ["Personajes históricos","¿Quién recopiló canciones del folclore chileno y compuso «Gracias a la vida»?",["Violeta Parra","Gabriela Mistral","Pablo Neruda","Bernardo O’Higgins"],0,"Violeta Parra investigó y difundió el folclore chileno.","🎸"],
 ["Personajes históricos","¿Qué poeta chileno recibió el Premio Nobel de Literatura en 1971?",["Pablo Neruda","Arturo Prat","Pedro de Valdivia","Cristóbal Colón"],0,"Pablo Neruda recibió ese reconocimiento en 1971.","📖"],
 ["Fiestas tradicionales","¿En qué fiesta se celebra la cosecha de las uvas?",["Fiesta de la Vendimia","Fiesta de San Pedro","Fiesta de Cuasimodo","Fiesta de la Tirana"],0,"La vendimia celebra la cosecha de la uva y la producción del vino.","🍇"],
 ["Fiestas tradicionales","¿Qué fiesta religiosa se reconoce por sus jinetes con vestimentas coloridas?",["Fiesta de Cuasimodo","Tapati Rapa Nui","Minga Chilota","Fiesta de la Vendimia"],0,"Los cuasimodistas acompañan al sacerdote, muchas veces a caballo.","🐎"],
 ["Fiestas tradicionales","¿Qué fiesta honra al patrono de los pescadores?",["Fiesta de San Pedro","Fiesta de la Tirana","Fiesta de la Vendimia","Tapati Rapa Nui"],0,"San Pedro es reconocido como patrono de los pescadores.","🎣"],
 ["Fiestas tradicionales","¿Qué celebración pertenece a Rapa Nui?",["Tapati Rapa Nui","Minga Chilota","Fiesta de Cuasimodo","Fiesta de San Pedro"],0,"La Tapati celebra la cultura y tradiciones rapanui.","🗿"],
 ["Fiestas tradicionales","¿En qué tradición de Chiloé la comunidad ayuda a trasladar una casa?",["Minga Chilota","Fiesta de la Tirana","Fiesta de la Vendimia","Fiesta de San Pedro"],0,"La minga es un trabajo comunitario y solidario.","🏠"],
 ["Fiestas tradicionales","¿Qué fiesta del norte de Chile reúne bailes religiosos y trajes coloridos?",["Fiesta de la Tirana","Tapati Rapa Nui","Minga Chilota","Fiesta de Cuasimodo"],0,"La Fiesta de La Tirana se celebra en la Región de Tarapacá.","🥁"],
 ["Bailes tradicionales","¿Cuál es el baile nacional de Chile?",["La cueca","El tango","La samba","El flamenco"],0,"La cueca representa un juego de conquista y se baila con pañuelo.","💃"],
 ["Comidas tradicionales","¿Qué plato lleva caldo, carne, papa y zapallo?",["Cazuela","Humita","Empanada de pino","Sushi"],0,"La cazuela es un caldo con carne y verduras.","🍲"],
 ["Comidas tradicionales","¿Qué comida se prepara con choclo molido y se envuelve en sus hojas?",["Humita","Cazuela","Empanada de pino","Pan amasado"],0,"La humita se cocina envuelta en hojas de choclo.","🌽"],
 ["Comidas tradicionales","¿Qué relleno tradicional tiene una empanada de pino?",["Carne y cebolla","Choclo dulce","Pescado crudo","Solo queso"],0,"El pino se prepara principalmente con carne y cebolla.","🥟"],
 ["Patrimonio natural","¿Cuál es la flor nacional de Chile?",["El copihue","La rosa","El girasol","El tulipán"],0,"El copihue es una enredadera nativa y flor nacional.","🌺"],
 ["Patrimonio natural","¿Qué árbol chileno también se conoce como pehuén?",["La araucaria","El manzano","La palmera","El sauce"],0,"La araucaria o pehuén es un árbol nativo y longevo.","🌲"],
 ["Patrimonio natural","¿Cuál de estos animales es una gran ave que vuela sobre la cordillera?",["El cóndor","El huemul","El pudú","El zorro"],0,"El cóndor es un ave andina y aparece en el escudo.","🦅"],
 ["Patrimonio natural","¿Cuál es un ciervo nativo de Chile que aparece en el escudo?",["El huemul","El cóndor","La ballena","El pingüino"],0,"El huemul es un ciervo andino protegido.","🦌"],
 ["Monumentos","¿Por qué cuidamos los monumentos históricos?",["Porque conservan la memoria y la historia","Porque son juguetes","Porque se pueden reemplazar cada año","Porque no pertenecen a nadie"],0,"Los monumentos nos ayudan a conocer y recordar el pasado.","🏛️"],
 ["Monumentos","Una estatua que recuerda a Arturo Prat es importante porque...",["Homenajea a una persona y un hecho histórico","Sirve solo para decorar","Es una casa moderna","Indica el clima"],0,"Los monumentos pueden conmemorar personas y acontecimientos.","🗽"],
 ["Niños en el mundo","Una niña vive en Japón y tú en Chile. ¿Qué puede ser diferente?",["El idioma y la ubicación","La necesidad de jugar","El derecho a aprender","La necesidad de cariño"],0,"Pueden vivir en lugares y hablar idiomas distintos, pero comparten derechos.","🌏"],
 ["Niños en el mundo","¿Cuál es un deber que comparten los niños en distintos países?",["Respetar a los demás y cumplir sus responsabilidades","Trabajar como adultos","Hablar el mismo idioma","Vivir en el mismo continente"],0,"Los deberes incluyen respetar y asumir responsabilidades apropiadas para su edad.","🤝"],
 ["Niños en el mundo","¿Qué tienen en común los niños aunque vivan en países diferentes?",["Tienen derechos y merecen respeto","Todos hablan español","Todos comen lo mismo","Todos usan la misma ropa"],0,"Cada cultura es distinta, pero todos los niños tienen derechos.","🧒🏽🧒🏻🧒🏿"]
];
let order=[],index=0,points=0,locked=false;const $=id=>document.getElementById(id);
function shuffle(a){return a.map(value=>({value,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(x=>x.value)}
function showVisual(value){const box=$("visual");box.innerHTML="";if(value.startsWith("http")){const img=new Image();img.alt="";img.src=value;img.onerror=()=>{box.textContent="🇨🇱"};box.appendChild(img)}else box.textContent=value}
function start(){order=shuffle([...questions]);index=points=0;$("game").style.display="block";$("finish").classList.remove("show");render()}
function render(){locked=false;const q=order[index];$("topic").textContent="🧭 "+q[0];$("question").textContent=q[1];showVisual(q[5]);$("feedback").textContent="";$("next").classList.remove("show");$("count").textContent=`${index+1} / ${order.length}`;$("score").textContent=`⭐ ${points} puntos`;$("bar").style.width=`${index/order.length*100}%`;$("answers").innerHTML="";shuffle(q[2].map((label,i)=>({label,correct:i===q[3]}))).forEach(option=>{const button=document.createElement("button");button.className="answer";button.textContent=option.label;button.onclick=()=>answer(button,option.correct,q);$("answers").appendChild(button)})}
function answer(button,correct,q){if(locked)return;locked=true;[...$("answers").children].forEach(b=>b.disabled=true);button.classList.add(correct?"correct":"wrong");if(correct){points++;$("feedback").textContent="¡Correcto! ✨ "+q[4]}else{$("feedback").textContent="Buen intento 💡 "+q[4];[...$("answers").children].find(b=>b.textContent===q[2][q[3]]).classList.add("correct")}$("score").textContent=`⭐ ${points} puntos`;$("next").textContent=index===order.length-1?"Ver resultado 🏆":"Siguiente ➜";$("next").classList.add("show")}
$("next").onclick=()=>{if(++index<order.length)render();else{$("game").style.display="none";$("finish").classList.add("show");const message=points>=27?"¡Excelente! Conoces muy bien el patrimonio de Chile.":points>=20?"¡Muy bien! Tu viaje por la historia fue genial.":"¡Buen esfuerzo! Vuelve a viajar para seguir aprendiendo.";$("result").textContent=`Obtuviste ${points} de ${order.length} puntos. ${message}`}};$("restart").onclick=start;start();
</script></body></html>
