<style>
:root{--pink:#ff4fd8;--cyan:#00e5ff;--yellow:#ffe45c;--purple:#3a1268;--dark:#17062d;--card:#28104d;--green:#58ff8a;--orange:#ff8a30}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Nunito,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#6833b8 0 12%,transparent 30%),linear-gradient(180deg,#130522,#28104d 58%,#12051f);overflow-x:hidden}.arena{position:fixed;inset:0;pointer-events:none;opacity:.65;background:linear-gradient(transparent 70%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.05) 48px),radial-gradient(circle at 15% 75%,#ff4fd8 0 3px,transparent 4px),radial-gradient(circle at 80% 20%,#00e5ff 0 3px,transparent 4px)}.wrap{position:relative;z-index:1;max-width:980px;margin:auto;padding:24px 16px 42px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.back{color:#fff;text-decoration:none;background:#0008;border:3px solid var(--cyan);border-radius:12px;padding:10px 12px;font-weight:900}.badge{font-family:'Press Start 2P';font-size:10px;color:var(--yellow);text-shadow:2px 2px #000}.screen{min-height:72vh;border:5px solid #fff;border-radius:22px;background:linear-gradient(135deg,rgba(255,79,216,.20),rgba(0,229,255,.14)),var(--card);box-shadow:0 0 0 6px #000,0 18px 50px #0009;position:relative;overflow:hidden;padding:clamp(18px,4vw,34px)}.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 8px);pointer-events:none}.view{position:relative;z-index:2;display:none;min-height:calc(72vh - 68px)}.view.active{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.title{font-family:'Press Start 2P';font-size:clamp(25px,8vw,58px);line-height:1.2;color:var(--yellow);text-shadow:4px 4px #e0177f,8px 8px #000;margin:0 0 18px}.subtitle{font-size:clamp(18px,4vw,28px);font-weight:900;max-width:760px}.fighters{display:flex;justify-content:space-between;width:100%;font-size:clamp(44px,11vw,95px);margin:18px 0;filter:drop-shadow(5px 8px #0008)}.btn{cursor:pointer;border:0;border-radius:16px;background:linear-gradient(#ffe45c,#ff8a30);color:#230038;font-weight:900;font-size:clamp(17px,3vw,24px);padding:16px 24px;box-shadow:0 7px #8d3b00,0 0 0 4px #fff;text-transform:uppercase}.btn:active{transform:translateY(5px);box-shadow:0 2px #8d3b00,0 0 0 4px #fff}.config{display:grid;gap:22px;width:100%;max-width:820px}.panel{background:#0006;border:3px solid var(--cyan);border-radius:18px;padding:18px}.panel h2{font-family:'Press Start 2P';font-size:clamp(12px,2.5vw,16px);color:var(--yellow);margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.choice input{position:absolute;opacity:0}.choice span{display:block;padding:14px 10px;border:3px solid #fff;border-radius:14px;background:#28104d;font-size:18px;font-weight:900}.choice input:checked+span{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff;transform:scale(1.03);box-shadow:0 0 18px var(--cyan)}.hud{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:24px}.timer{font-family:'Press Start 2P';color:var(--yellow);font-size:clamp(14px,4vw,24px);text-shadow:3px 3px #000}.bar{height:28px;background:#000;border:4px solid #fff;border-radius:20px;overflow:hidden}.bar-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));transition:width .2s linear}.word-card{width:min(92vw,760px);min-height:230px;display:flex;align-items:center;justify-content:center;border:6px solid #fff;border-radius:26px;background:radial-gradient(circle,#fff 0 56%,#ffe8fb);color:#1e0636;box-shadow:0 14px #0008,0 0 40px #ff4fd888}.word{font-size:clamp(44px,12vw,104px);font-weight:900;letter-spacing:.03em;animation:pop .28s ease}.counter{margin-top:22px;font-size:clamp(18px,4vw,28px);font-weight:900}.spark{position:absolute;inset:auto 10% 9% auto;font-size:56px;animation:bob 1s infinite alternate}.final-card{background:#0007;border:4px solid var(--yellow);border-radius:22px;padding:26px;max-width:680px}.final-card h2{font-family:'Press Start 2P';font-size:clamp(18px,5vw,34px);color:var(--yellow)}.stats{font-size:clamp(20px,4vw,32px);font-weight:900;margin:18px 0}@keyframes pop{from{transform:scale(.72) rotate(-2deg);opacity:.35}to{transform:scale(1);opacity:1}}@keyframes bob{to{transform:translateY(-16px)}}@media(max-width:620px){.top{align-items:flex-start}.screen{border-width:4px}.hud{grid-template-columns:1fr}.fighters{margin:10px 0}.word-card{min-height:190px}.choice span{font-size:16px}}

<body><div class="arena"></div><main class="wrap"><div class="top"><a class="back" href="../index.html">← Menú</a><div class="badge">ARCADE LECTOR</div></div><section class="screen"><div id="startView" class="view active"><h1 class="title">Dominio<br>Lector</h1><p class="subtitle">¡Lee cada palabra en voz alta antes de que cambie la energía!</p><div class="fighters"><span>📚✨</span><span>🦸‍♀️</span></div><button class="btn" id="goConfig">Elegir desafío</button></div><div id="configView" class="view"><h1 class="title">Elige tu reto</h1><form class="config" id="configForm"><div class="panel"><h2>Tiempo total</h2><div class="choices"><label class="choice"><input type="radio" name="seconds" value="30" checked><span>30 segundos</span></label><label class="choice"><input type="radio" name="seconds" value="60"><span>1 minuto</span></label><label class="choice"><input type="radio" name="seconds" value="90"><span>1 minuto y medio</span></label></div></div><div class="panel"><h2>Cantidad de palabras</h2><div class="choices"><label class="choice"><input type="radio" name="count" value="20" checked><span>20 palabras</span></label><label class="choice"><input type="radio" name="count" value="30"><span>30 palabras</span></label><label class="choice"><input type="radio" name="count" value="40"><span>40 palabras</span></label></div></div><div class="panel"><h2>Dificultad</h2><div class="choices"><label class="choice"><input type="radio" name="level" value="1" checked><span>Nivel 1<br>2 y 3 sílabas</span></label><label class="choice"><input type="radio" name="level" value="2"><span>Nivel 2<br>3, 4 o más sílabas</span></label><label class="choice"><input type="radio" name="level" value="3"><span>Nivel 3<br>ca, ce, ci, co, cu y z</span></label></div></div><button class="btn" type="submit">Comenzar</button></form></div><div id="gameView" class="view"><div class="hud"><div class="bar"><div id="barFill" class="bar-fill"></div></div><div id="timer" class="timer">00:30</div></div><div class="word-card"><div id="word" class="word">lista</div></div><div id="counter" class="counter">Palabra 1 de 20</div><div class="spark">⚡</div></div><div id="finalView" class="view"><div class="final-card"><h2>¡Excelente lectura!</h2><p class="subtitle">Ganaste el combate amistoso de palabras.</p><p id="finalStats" class="stats"></p><button class="btn" id="playAgain">Jugar nuevamente</button></div></div></section></main><script>

const views={start:document.getElementById('startView'),config:document.getElementById('configView'),game:document.getElementById('gameView'),final:document.getElementById('finalView')};
const wordEl=document.getElementById('word'),timerEl=document.getElementById('timer'),barFill=document.getElementById('barFill'),counterEl=document.getElementById('counter'),finalStats=document.getElementById('finalStats');
let gameTimer,wordTimer,round=[];
function show(name){Object.values(views).forEach(v=>v.classList.remove('active'));views[name].classList.add('active')}

function shuffle(list){const a=[...new Set(list)];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const level3Pattern=/(ca|ce|ci|co|cu|z)/i;

function createRound(level,count){
  if(level==='1')return shuffle(level1Words).slice(0,count);
  if(level==='2')return shuffle(level2Words).slice(0,count);

  const wordBank=[...new Set([...level1Words,...level2Words])];
  const focusedWords=wordBank.filter(word=>level3Pattern.test(word));
  const otherWords=wordBank.filter(word=>!level3Pattern.test(word));
  const focusedCount=Math.round(count*.6);
  return shuffle([
    ...shuffle(focusedWords).slice(0,focusedCount),
    ...shuffle(otherWords).slice(0,count-focusedCount)
  ]);
}

function format(s){const m=Math.floor(s/60);const sec=Math.ceil(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}

function startGame({seconds,count,level}){clearInterval(gameTimer);clearInterval(wordTimer);round=createRound(level,count);const perWord=seconds/count;let start=Date.now(),index=0;showWord();show('game');gameTimer=setInterval(()=>{const elapsed=(Date.now()-start)/1000;const left=Math.max(0,seconds-elapsed);timerEl.textContent=format(left);barFill.style.width=(left/seconds*100)+'%';if(left<=0)finish(count)},100);wordTimer=setInterval(()=>{index++;if(index>=round.length){finish(count);return}showWord()},perWord*1000);

function showWord(){wordEl.style.animation='none';void wordEl.offsetWidth;wordEl.style.animation='pop .28s ease';wordEl.textContent=round[index];counterEl.textContent='Palabra '+(index+1)+' de '+count}}

function finish(count){clearInterval(gameTimer);clearInterval(wordTimer);finalStats.textContent='Mostraste '+count+' palabras. ¡Sigue practicando!';show('final')}
