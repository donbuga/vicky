<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8e8"><title>Prueba del Sol 2 · Ciencias</title><style>
:root{--ink:#243e39;--green:#2a6753;--cream:#fff8e8;--orange:#ee9a34}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,'Trebuchet MS',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #287bc0;outline-offset:5px}header{max-width:1160px;margin:auto;padding:25px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:bold;font-size:20px}.brand span{background:#ffda75;border-radius:50%;padding:9px;margin-right:9px}nav{display:flex;gap:10px}.quiet{background:transparent;border:1px solid #c5ccbc;border-radius:30px;padding:11px 20px;color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px 28px 60px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:bold;color:#527963}.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:22px}h1{font-size:clamp(48px,6.5vw,84px);line-height:1.02;letter-spacing:-3px;margin:22px 0}h1 em{font-style:normal;color:#ce7623}p{line-height:1.7}.intro{max-width:440px;color:#62716a;font-size:18px}.primary{border:0;background:var(--green);color:white;border-radius:16px;padding:17px 26px;font-weight:bold;box-shadow:0 5px 0 #1b4e3c}.primary:hover{background:#20533f}.little{font-size:13px;color:#6a796d;margin-top:20px}.illustration{width:100%;max-height:440px}.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}.tile{border:1px solid #e3dfcd;border-radius:20px;padding:23px;background:#fffcf4}.tile .icon{font-size:28px}.tile h3{margin:15px 0 8px;font-size:17px}.tile p{font-size:14px;color:#6a756d;margin:0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-top:38px}.sectionhead h2{font-size:23px}.pill{font-size:12px;border-radius:20px;background:#eee9d7;padding:8px 13px}.hidden{display:none!important}.game{max-width:800px;margin:8px auto}.topline{display:flex;justify-content:space-between;align-items:center;font-size:14px}.bar{height:8px;border-radius:9px;background:#e7e5d3;margin:18px 0 30px}.bar i{display:block;height:100%;background:#e9ad46;border-radius:9px;transition:width .4s}.card{background:#fffdf6;border:1px solid #e4dfcc;border-radius:28px;padding:36px;box-shadow:0 10px 35px #605c1010}.question-icon{text-align:center;font-size:64px;padding:15px}.card h2{text-align:center;line-height:1.4;font-size:27px;margin:12px 0 28px}.answers{display:grid;gap:12px}.answer{background:white;border:2px solid #e1e5d8;border-radius:15px;padding:17px 20px;text-align:left;color:var(--ink);font-size:17px}.answer:not(:disabled):hover{border-color:#739884;background:#f0f6eb}.answer:disabled{cursor:default;color:var(--ink)}.answer.correct{background:#e6f1df;border-color:#538966}.answer.wrong{background:#fff0e8;border-color:#d99c83}.feedback{margin-top:23px;padding:18px;border-radius:16px;background:#f1edda;line-height:1.6}.next{margin-top:20px;width:100%}.study{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.study .tile p{font-size:16px}.result{text-align:center}.result h2{font-size:35px}.score{font-size:65px;color:#ca8023;margin:20px}.review{text-align:left;max-height:320px;overflow:auto;margin:25px 0}.review p{padding:12px;background:#f4efdf;border-radius:10px}footer{text-align:center;font-size:12px;color:#7d8579;padding:15px}.orbit{transform-origin:250px 205px;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}@media(max-width:650px){header{padding:20px 18px}.brand{font-size:16px}.quiet{padding:9px 12px;font-size:13px}main{padding:15px 20px 40px}.hero{grid-template-columns:1fr}h1{font-size:58px}.illustration{max-height:280px}.missions,.study{grid-template-columns:1fr}.card{padding:23px 18px}.card h2{font-size:23px}.sectionhead{gap:10px}.pill{white-space:nowrap}}
</style></head><body><header><div class="brand"><span aria-hidden="true">☀</span> Pequeños exploradores</div><nav><button class="quiet" onclick="home()">Inicio</button><button class="quiet" onclick="study()">Repasar ✧</button></nav></header><main id="main"></main><footer>Una aventura de ciencias · Aprende a tu ritmo, sin cronómetro.</footer><script>
const questions=[
['☀️','El Sol','¿Qué es el Sol?',['Una estrella que nos da luz y calor','Un planeta de piedra','Una luna gigante'],0,'El Sol es una estrella. Su luz y su calor hacen posible la vida en la Tierra.'],
['🌤️','El Sol','¿Cuándo podemos ver el Sol en el cielo?',['Durante la noche','Durante el día, si las nubes no lo tapan','Solo cuando llueve'],1,'Podemos ver el Sol durante el día cuando el cielo está despejado. Nunca lo mires directamente: puede dañar tus ojos.'],
['🌍','Día y noche','¿Qué movimiento de la Tierra produce el día y la noche?',['La rotación: girar sobre sí misma','Saltar arriba y abajo','El movimiento de las nubes'],0,'La Tierra gira sobre sí misma. Este movimiento se llama rotación y tarda aproximadamente 24 horas.'],
['☀️ 🌍','Día y noche','En la parte de la Tierra que recibe la luz del Sol…',['Es de noche','Es de día','Siempre hace frío'],1,'Es de día en la parte que está iluminada por el Sol. En la parte que queda de espaldas al Sol es de noche.'],
['🌙','Día y noche','¿Por qué llega la noche al lugar donde vivimos?',['Porque el Sol se apaga','Porque la Luna tapa siempre el Sol','Porque la Tierra gira y ese lugar deja de recibir luz del Sol'],2,'El Sol sigue brillando. Al girar la Tierra, nuestro lugar pasa a la parte que no recibe su luz.'],
['🎒','Nuestras actividades','¿Qué actividad solemos hacer durante el día?',['Ir a la escuela','Observar estrellas en un cielo oscuro','Dormir toda la noche'],0,'Generalmente vamos a la escuela y jugamos al aire libre durante el día. Las rutinas pueden variar entre personas.'],
['🛏️','Nuestras actividades','¿Qué actividad solemos hacer por la noche?',['Ir al recreo de la mañana','Dormir para descansar','Desayunar antes de ir a clases'],1,'Por la noche solemos dormir y descansar para recuperar energía.'],
['🦋','Seres vivos','¿Cuál de estos animales suele estar activo de día?',['Una mariposa diurna','Un murciélago nocturno','Una lechuza nocturna'],0,'Muchas mariposas vuelan de día y visitan flores para alimentarse del néctar.'],
['🦇','Seres vivos','¿Cuál de estos animales suele estar activo de noche?',['Una gallina','Una abeja','Un murciélago nocturno'],2,'Muchos murciélagos salen de noche para buscar alimento. Los animales nocturnos están activos principalmente durante la noche.'],
['🐝','Seres vivos','Las abejas que visitan flores con la luz del día son…',['Diurnas','Nocturnas','Estrellas'],0,'Las abejas suelen buscar alimento de día. Diurno significa que tiene actividad principalmente durante el día.'],
['🦉','Seres vivos','Una lechuza que caza de noche es un animal…',['Diurno','Nocturno','Que vive en el Sol'],1,'Muchas lechuzas son nocturnas: suelen descansar de día y buscar alimento por la noche.'],
['🌼','Flores','La flor del dondiego de día se abre con la luz del día. Es una flor…',['Nocturna','Diurna','Sin pétalos'],1,'El dondiego de día es un ejemplo de planta cuyas flores se abren de día.'],
['🌸 🌙','Flores','Las flores de la dama de noche (Epiphyllum oxypetalum) se abren por la noche. Son…',['Diurnas','Nocturnas','De hielo'],1,'Esta planta, también llamada reina de la noche, abre sus grandes flores por la noche. No todas las flores se abren al mismo tiempo.'],
['🌅','Momentos del día','El cielo comienza a iluminarse y el Sol aparece por el horizonte. ¿Qué momento es?',['Mediodía','Anochecer','Amanecer'],2,'Al amanecer comienza el día. Vemos aparecer el Sol cerca del horizonte.'],
['☀️','Momentos del día','¿Cuándo vemos el Sol alto en el cielo y suele sentirse más calor que al amanecer?',['Al mediodía','Al anochecer','Durante la medianoche'],0,'Al mediodía el Sol está alto en el cielo y suele sentirse más calor que temprano por la mañana. La temperatura máxima puede llegar más tarde.'],
['🌇','Momentos del día','El Sol se ve bajo y está por ocultarse. El cielo puede verse naranja. Es…',['El amanecer','El atardecer','El mediodía'],1,'Al atardecer el Sol se ve cada vez más bajo, cerca del horizonte, antes de ocultarse.'],
['🌌','Momentos del día','El Sol ya se ocultó y el cielo se oscurece. ¿Qué momento comienza?',['El mediodía','El amanecer','El anochecer'],2,'Al anochecer disminuye la luz del cielo y comienza la noche. Pueden empezar a verse estrellas.'],
['🌅 ☀️ 🌇 🌌','Momentos del día','¿Cuál es el orden correcto de estos momentos del día?',['Anochecer → mediodía → amanecer → atardecer','Amanecer → mediodía → atardecer → anochecer','Mediodía → anochecer → atardecer → amanecer'],1,'Primero amanece, luego llega el mediodía, después el atardecer y finalmente anochece.'],
['☀️ 🌍 🌙','Tamaños','¿Cuál es el más grande en tamaño real?',['La Luna','La Tierra','El Sol'],2,'El Sol es mucho más grande que la Tierra y que la Luna. ¡Es una estrella enorme!'],
['🌍 🌙','Tamaños','¿Cuál es más grande: la Tierra o la Luna?',['La Tierra','La Luna','Son del mismo tamaño'],0,'La Tierra es más grande que la Luna. La Luna es nuestro satélite natural.'],
['🔭','Tamaños','Ordena de mayor a menor tamaño real.',['Luna → Tierra → Sol','Sol → Tierra → Luna','Tierra → Sol → Luna'],1,'De mayor a menor: Sol, Tierra y Luna. El Sol parece pequeño en el cielo porque está muy lejos.']
];
const notes=[['☀️','Nuestra estrella','El Sol es una estrella que nos da luz y calor. Lo vemos durante el día si las nubes no lo ocultan. Nunca mires directamente al Sol.'],['🌍','La Tierra gira','La rotación es el giro de la Tierra sobre sí misma. Tarda unas 24 horas. En la parte iluminada es de día; en la otra parte es de noche.'],['🎒','Día y noche','De día solemos ir a la escuela y jugar al aire libre. De noche solemos dormir. Cada familia puede tener rutinas distintas.'],['🦋','Animales y flores','Diurnos: abejas, muchas mariposas y flores del dondiego de día. Nocturnos: muchos murciélagos, lechuzas y flores de la reina de la noche.'],['🌅','Cuatro momentos','Amanecer: aparece el Sol. Mediodía: Sol alto y suele hacer más calor que al amanecer. Atardecer: Sol bajo, por ocultarse. Anochecer: el Sol ya se ocultó y oscurece.'],['🔭','¿Quién es más grande?','El tamaño real, de mayor a menor, es: Sol → Tierra → Luna. Los dibujos del juego son ilustraciones y no están a escala.']];
let index=0,score=0,locked=false,missed=[],deck=[];const main=document.getElementById('main');
function home(){main.innerHTML=`<section class="hero"><div><div class="tag">Ciencias naturales · Aprende jugando</div><h1>Prueba del<br><em>Sol 2</em></h1><p class="intro">¡Una aventura de día y de noche! Explora el cielo, descubre seres vivos y demuestra todo lo que sabes.</p><button class="primary" onclick="start()">Comenzar aventura &nbsp; →</button><p class="little">21 retos · Sin prisa · Una estrella por acierto</p></div><svg class="illustration" viewBox="0 0 500 440" role="img" aria-label="Un Sol sonriente sobre colinas verdes"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f7e4ac"/><stop offset="1" stop-color="#f7edce"/></linearGradient></defs><rect x="20" y="15" width="460" height="410" rx="220" fill="url(#sky)"/><g fill="#fffcf1"><ellipse cx="110" cy="120" rx="50" ry="15"/><ellipse cx="132" cy="108" rx="24" ry="20"/><ellipse cx="390" cy="255" rx="55" ry="16"/><ellipse cx="375" cy="244" rx="25" ry="22"/></g><g class="orbit"><g stroke="#efa945" stroke-width="9" stroke-linecap="round"><path d="M250 57v-20m0 288v-20M108 181H88m324 0h-20M150 81l-15-15m230 230-15-15M150 281l-15 15M350 81l15-15"/></g><circle cx="250" cy="181" r="91" fill="#f6ba4c"/><circle cx="221" cy="175" r="6" fill="#5e563b"/><circle cx="279" cy="175" r="6" fill="#5e563b"/><path d="M230 204q20 22 40 0" fill="none" stroke="#5e563b" stroke-width="5" stroke-linecap="round"/><ellipse cx="203" cy="194" rx="12" ry="7" fill="#eea15b"/><ellipse cx="297" cy="194" rx="12" ry="7" fill="#eea15b"/></g><path d="M28 330Q170 250 345 345T470 334V395Q250 460 28 385Z" fill="#afcba0"/><path d="M45 371Q250 280 460 367Q420 428 250 429T45 371" fill="#6d9b78"/><g fill="#fff0bd"><path d="M120 345l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M367 363l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g></svg></section><div class="sectionhead"><h2>Tu misión de hoy</h2><span class="pill">6 temas por descubrir</span></div><div class="missions">${[['☀️','Conoce el cielo','El Sol, la Tierra, la Luna y sus tamaños.'],['🌅','Viaja por el día','Rotación, actividades y momentos del día.'],['🦉','Descubre la naturaleza','Animales y flores diurnos y nocturnos.']].map(a=>`<div class="tile"><span class="icon">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}</div>`}
function study(){main.innerHTML=`<div class="sectionhead" style="margin-top:0"><div><div class="tag">Antes de la aventura</div><h2>Un pequeño repaso</h2></div><button class="primary" onclick="start()">¡A jugar! →</button></div><div class="study">${notes.map(n=>`<article class="tile"><span class="icon">${n[0]}</span><h3>${n[1]}</h3><p>${n[2]}</p></article>`).join('')}</div>`;window.scrollTo(0,0)}
function start(retry=false){deck=retry?missed.slice():questions.slice();index=0;score=0;missed=[];render()}
function render(){locked=false;const q=deck[index];main.innerHTML=`<div class="game"><div class="topline"><span>Reto ${index+1} de ${deck.length}</span><strong>⭐ ${score} estrellas</strong></div><div class="bar" role="progressbar" aria-label="Progreso" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${deck.length}"><i style="width:${index/deck.length*100}%"></i></div><div class="card"><div class="tag">${q[1]}</div><div class="question-icon" aria-hidden="true">${q[0]}</div><h2 id="question" tabindex="-1">${q[2]}</h2><div class="answers">${q[3].map((a,i)=>`<button class="answer" onclick="answer(${i})">${a}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div><p class="little" style="text-align:center">Piensa, elige y descubre. ¡Cada reto te enseña algo!</p></div>`;document.getElementById('question').focus({preventScroll:true});window.scrollTo(0,0)}
function answer(choice){if(locked)return;locked=true;const q=deck[index],correct=choice===q[4];if(correct)score++;else missed.push(q);document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q[4]){b.classList.add('correct');b.textContent='✓ '+b.textContent}else if(i===choice){b.classList.add('wrong');b.textContent='↻ '+b.textContent}});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${correct?'¡Muy bien! Ganaste una estrella.':'¡Sigamos aprendiendo!'}</strong><br>${q[5]}</div><button class="primary next" onclick="next()">${index===deck.length-1?'Ver mis resultados':'Siguiente reto'} →</button>`;document.querySelector('.next').focus({preventScroll:true})}
function next(){index++;if(index<deck.length)render();else finish()}
function finish(){main.innerHTML=`<div class="game card result"><div class="tag">Aventura completada</div><div class="question-icon">${score===deck.length?'🏆':'🌟'}</div><h2>¡Has explorado el día y la noche!</h2><div class="score">${score} / ${deck.length}</div><p>Estrellas conseguidas. ${missed.length?'¡Cada intento te ayuda a aprender! Puedes volver a practicar los retos que te costaron.':'¡Excelente! Conoces muy bien al Sol y sus secretos.'}</p>${missed.length?'<button class="primary" onclick="start(true)">Practicar mis errores →</button>':''}<div class="review">${missed.map(q=>`<p><strong>${q[2]}</strong><br>${q[5]}</p>`).join('')}</div><button class="quiet" onclick="start()">Jugar todo otra vez</button> <button class="quiet" onclick="study()">Repasar los temas</button></div>`;window.scrollTo(0,0)}home();
</script></body></html>
