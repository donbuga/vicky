<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practicando frases</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff79ad;--pink2:#ffd6e6;--yellow:#ffe56b;--green:#7edc9b;--ink:#563650;--white:#fffdf8;--shadow:#d94f86}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Fredoka,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ffd3e5,#fff4a8 52%,#b9f3c9);overflow-x:hidden}.pixels{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 15%,#fff 0 5px,transparent 6px),radial-gradient(circle at 88% 22%,#fff 0 4px,transparent 5px),radial-gradient(circle at 17% 82%,#fff 0 4px,transparent 5px);background-size:160px 140px;opacity:.65}.wrap{position:relative;max-width:950px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.back{color:var(--ink);font-weight:700;text-decoration:none;background:#fff;border:3px solid var(--pink);border-radius:14px;padding:10px 14px;box-shadow:0 5px #dc6b98}.logo{font-family:'Press Start 2P';font-size:clamp(8px,2vw,12px);color:#d63d79}.console{position:relative;min-height:78vh;background:var(--white);border:5px solid var(--pink);border-radius:32px;box-shadow:0 12px 0 var(--shadow),0 18px 35px #9e4a7044;padding:clamp(20px,4vw,38px);overflow:hidden}.console:before,.console:after{content:'✦';position:absolute;font-size:60px;color:var(--yellow)}.console:before{left:-8px;top:18px}.console:after{right:8px;bottom:10px;color:var(--green)}.view{display:none;position:relative;z-index:1}.view.active{display:flex;flex-direction:column;align-items:center}.title{font-family:'Press Start 2P';font-size:clamp(22px,6vw,48px);line-height:1.4;text-align:center;color:var(--pink);text-shadow:3px 3px #fff,6px 6px var(--yellow);margin:5px 0 10px}.lead{text-align:center;font-size:clamp(18px,3vw,24px);font-weight:600;max-width:700px;margin:8px auto 22px}.mascots{font-size:clamp(55px,10vw,90px);filter:drop-shadow(0 7px 0 #f3b5cc);margin:8px}.btn{border:3px solid #fff;outline:3px solid var(--shadow);border-radius:16px;padding:14px 22px;background:linear-gradient(#ff9fc2,var(--pink));box-shadow:0 7px var(--shadow);color:#fff;font:700 clamp(17px,3vw,22px) Fredoka;cursor:pointer}.btn:active{transform:translateY(5px);box-shadow:0 2px var(--shadow)}.config{width:100%;max-width:790px;display:grid;gap:16px}.panel{background:#fff9dc;border:3px dashed #efb936;border-radius:20px;padding:17px}.panel:nth-child(2){background:#e7f9ed;border-color:#5abb79}.panel:nth-child(3){background:#ffe5ef;border-color:var(--pink)}.panel h2{font-family:'Press Start 2P';font-size:clamp(11px,2.4vw,15px);line-height:1.5;margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.choice input{position:absolute;opacity:0}.choice span{display:block;height:100%;padding:13px 9px;text-align:center;background:#fff;border:3px solid #e9bdd0;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer}.choice input:checked+span{background:var(--yellow);border-color:var(--pink);transform:translateY(-3px);box-shadow:0 5px var(--pink)}.hint{margin:0;font-size:14px;text-align:center}.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;font-weight:700;font-size:18px}.timer{background:var(--yellow);border:3px solid #e8b92f;border-radius:14px;padding:10px}.progress{height:22px;border:3px solid var(--green);border-radius:14px;overflow:hidden;background:#e6f9ec}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));transition:width .3s}.phrase-card{width:min(100%,760px);min-height:250px;margin:42px 0 28px;border:5px solid var(--pink);border-radius:28px;background:linear-gradient(145deg,#fff,#fff4b9);box-shadow:0 10px 0 #f0a8c4;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}.phrase{font-size:clamp(35px,7vw,62px);font-weight:700;line-height:1.25;animation:pop .3s}.game-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.secondary{background:linear-gradient(#9be8af,var(--green));box-shadow:0 7px #459d61;outline-color:#459d61}.result{background:#fff9d5;border:4px solid var(--yellow);border-radius:25px;padding:25px;text-align:center;max-width:650px}.result h2{font-family:'Press Start 2P';color:var(--pink);line-height:1.5}.stars{font-size:55px}.stats{font-size:22px;line-height:1.5}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:600px){.console{border-width:4px}.hud{grid-template-columns:1fr 1fr}.progress{grid-column:1/-1;grid-row:2}.phrase-card{min-height:210px;margin-top:25px}.choice span{font-size:15px}}
</style>
</head>
<body><div class="pixels"></div><main class="wrap"><header class="top"><a class="back" href="../index.html">← Menú</a><span class="logo">KAWAII READER</span></header><section class="console">
<div id="welcome" class="view active"><h1 class="title">Practicando<br>frases</h1><p class="lead">Lee frases cortitas en voz alta. ¡Cada lectura enciende una estrella!</p><div class="mascots">🌸🐰⭐</div><button class="btn" data-show="setup">Elegir mi reto</button></div>
<div id="setup" class="view"><h1 class="title">Elige tu reto</h1><form id="config" class="config">
<div class="panel"><h2>⭐ Nivel de dificultad</h2><div class="choices"><label class="choice"><input type="radio" name="level" value="easy" checked><span>🌱 Inicial<br>frases simples</span></label><label class="choice"><input type="radio" name="level" value="medium"><span>🌼 Aventurero<br>más variedad</span></label><label class="choice"><input type="radio" name="level" value="hard"><span>🏆 Experto<br>reto veloz</span></label></div></div>
<div class="panel"><h2>⏱ Tiempo para leer</h2><div class="choices"><label class="choice"><input type="radio" name="seconds" value="60" checked><span>1 minuto</span></label><label class="choice"><input type="radio" name="seconds" value="90"><span>1 minuto y medio</span></label><label class="choice"><input type="radio" name="seconds" value="120"><span>2 minutos</span></label></div></div>
<div class="panel"><h2>📖 Cantidad de frases</h2><div class="choices"><label class="choice"><input type="radio" name="count" value="4" checked><span>4 frases</span></label><label class="choice"><input type="radio" name="count" value="6"><span>6 frases</span></label><label class="choice"><input type="radio" name="count" value="8"><span>8 frases</span></label></div></div><p class="hint">Puedes combinar las opciones como prefieras.</p><button class="btn" type="submit">¡Comenzar!</button></form></div>
<div id="game" class="view"><div class="hud"><div id="timer" class="timer">01:00</div><div class="progress"><div id="fill" class="fill"></div></div><div id="counter">Frase 1 de 4</div></div><div class="phrase-card"><div id="phrase" class="phrase"></div></div><div class="game-actions"><button id="read" class="btn">¡Ya la leí! ⭐</button><button id="finish" class="btn secondary">Terminar</button></div></div>
<div id="result" class="view"><div class="result"><div class="stars">🌟🐰🌟</div><h2 id="resultTitle">¡Gran lectura!</h2><p id="stats" class="stats"></p><button id="again" class="btn">Jugar otra vez</button></div></div>
</section></main><script>
const phrases=[
"Charly barre la vereda","La rana brinca rápido","Bruno bebe leche tibia","Vera riega bellas flores","Dora lleva dos llaves","Quique quiere queso blanco","El cachorro corre alegre","La lluvia moja rosas","Roberto dibuja un barco","Victoria borda una bufanda",
"La ardilla busca bellotas","Chabela cocina rico arroz","Ramiro abre la ventana","El caballo bebe agua","Valeria lava la cuchara","David lee un cuento","La reina lleva corona","El burro cruza despacio","Lola barre el corredor","Raquel compra queso fresco",
"La rana viste verde","Brenda riega el jardín","El chico corre rápido","Violeta abre su regalo","Dario dibuja una ballena","La llave brilla mucho","Quique barre su cuarto","El cachorro bebe leche","Rita lleva vestido rosa","Bruno cruza el puente",
"La lluvia cae despacio","Chano come queso blando","Valeria abraza a Dora","El barco lleva verduras","La ardilla corre arriba","Rocío lava los platos","Bella dibuja una estrella","David abre la puerta","El caballo brinca feliz","La reina quiere bailar",
"Chabela lleva una mochila","Ramón barre hojas verdes","Vera recibe bellas flores","El río corre rápido","Quique dibuja un robot","La lluvia riega bosques","Bruno vende ricos duraznos","Dora lleva falda verde","Cachorro mueve su cola","Raquel abre su libro",
"La ballena nada despacio","Charly prepara leche tibia","Victoria riega la huerta","El burro lleva verduras","Lola quiere dos galletas","Ramiro dibuja un cohete","La ardilla brinca lejos","David barre la cocina","Violeta recibe un abrazo","El caballo corre libre",
"La lluvia moja caminos","Brenda lleva botas verdes","Quique quiere leer cuentos","Rita dibuja bellas nubes","El cachorro busca cariño","Valeria abre la cortina","Roberto prepara arroz rico","La reina visita Sevilla","Dario bebe jugo verde","Chano barre la vereda",
"La ardilla guarda comida","Vera lleva cabello largo","El barco cruza ríos","Bruno recibe un regalo","La lluvia borra huellas","Raquel quiere bailar ahora","El caballo duerme tranquilo","Victoria dibuja una llave","David riega cuatro rosales","La rana brinca arriba",
"Chabela abre la botella","Ramiro lleva camisa verde","El cachorro corre detrás","Dora quiere queso rallado","La reina borda flores","Violeta barre hojas secas","Quique recibe una medalla","El burro bebe despacio","Lola dibuja un corazón","Roberto abre el libro",
"La lluvia refresca valles","Brenda lleva un paraguas","El caballo cruza rápido","Valeria quiere una bicicleta","David dibuja cuatro barcos","La ardilla roba bellotas","Rita barre la habitación","Charly bebe jugo frío","La reina lleva brillantes","Quique abre la ventana"];
const views=["welcome","setup","game","result"];let selected=[],position=0,readCount=0,totalSeconds=60,remaining=60,tick;
function show(id){views.forEach(v=>document.getElementById(v).classList.toggle("active",v===id))}document.querySelector('[data-show="setup"]').onclick=()=>show("setup");
function shuffled(items){return [...items].sort(()=>Math.random()-.5)}
document.getElementById("config").onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget),count=Number(data.get("count")),level=data.get("level");totalSeconds=Number(data.get("seconds"));remaining=totalSeconds;const pools={easy:phrases.slice(0,34),medium:phrases.slice(25,75),hard:phrases.slice(50)};selected=shuffled(pools[level]).slice(0,count);position=readCount=0;show("game");render();clearInterval(tick);tick=setInterval(()=>{remaining--;updateTimer();if(remaining<=0)end(false)},1000)};
function updateTimer(){const m=Math.floor(remaining/60),s=remaining%60;document.getElementById("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function render(){updateTimer();document.getElementById("phrase").textContent=selected[position];document.getElementById("phrase").style.animation="none";requestAnimationFrame(()=>document.getElementById("phrase").style.animation="pop .3s");document.getElementById("counter").textContent=`Frase ${position+1} de ${selected.length}`;document.getElementById("fill").style.width=`${readCount/selected.length*100}%`}
document.getElementById("read").onclick=()=>{readCount++;if(readCount>=selected.length){end(true);return}position++;render()};document.getElementById("finish").onclick=()=>end(false);
function end(completed){clearInterval(tick);show("result");const words=selected.slice(0,readCount).reduce((n,p)=>n+p.split(" ").length,0),elapsed=Math.max(1,totalSeconds-remaining);document.getElementById("resultTitle").textContent=completed?"¡Reto completado!":"¡Buen entrenamiento!";document.getElementById("stats").innerHTML=`Leíste <strong>${readCount} frases</strong> y <strong>${words} palabras</strong> en ${elapsed} segundos.<br>¡Cada intento te hace leer mejor!`}
document.getElementById("again").onclick=()=>show("setup");
</script></body></html>
