<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación 01 Sept · Lenguaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#382852;--purple:#7651c9;--pink:#fa79a5;--yellow:#ffd868;--mint:#80dfc0;--paper:#fffdf7;--red:#d84562}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background:linear-gradient(140deg,#efe6ff,#fff1bb 52%,#c9f8e8)}button,input,textarea{font:inherit}.shell{width:min(940px,calc(100% - 24px));margin:auto;padding:18px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:var(--ink);text-decoration:none;font-weight:900}.badge{background:#fff;border:2px solid var(--purple);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:900}.card{background:var(--paper);border:4px solid var(--purple);border-radius:28px;box-shadow:0 10px 0 #bda9e8,0 18px 38px #51397925;padding:clamp(20px,5vw,42px);position:relative;overflow:hidden}.card:after{content:'✦';position:absolute;right:18px;top:12px;color:var(--pink);font-size:34px}.screen{display:none}.screen.active{display:block}.hero{text-align:center}.hero-icon{font-size:76px;margin:10px}.title{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:12px 0;color:var(--purple)}.subtitle{font-size:clamp(1rem,2.6vw,1.25rem);max-width:650px;margin:18px auto}.sound-map{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:24px auto}.sound-map span{padding:8px 12px;border-radius:12px;background:#f0e8ff;font-weight:900}.sound-map span:nth-child(2){background:#fff0b7}.sound-map span:nth-child(3){background:#d9f8ed}.btn{border:0;border-radius:15px;padding:13px 22px;background:var(--purple);color:#fff;font-weight:900;box-shadow:0 6px 0 #503391;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #503391}.btn.secondary{background:#fff;color:var(--purple);border:2px solid var(--purple);box-shadow:none}.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:25px;font-weight:900}.track{height:18px;flex:1;background:#ebe3f8;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:.3s}.question-label{text-transform:uppercase;letter-spacing:.12em;color:var(--purple);font-size:.78rem;font-weight:900}.prompt{font-size:clamp(1.3rem,4vw,2rem);margin:8px 0 20px}.picture{font-size:clamp(4rem,14vw,7rem);text-align:center;background:#f6f0ff;border:3px dashed #bca7e4;border-radius:20px;padding:15px;margin:8px 0 22px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{background:#fff;border:3px solid #d8cbed;border-radius:16px;padding:16px;color:var(--ink);font-weight:900;cursor:pointer}.option:hover,.option:focus{border-color:var(--purple);background:#f6f0ff}.option.correct{background:#d8f8e9;border-color:#36aa7f}.option.wrong{background:#ffe0e6;border-color:var(--red)}.writing{width:100%;min-height:105px;border:3px solid #cfbde9;border-radius:16px;padding:14px;resize:vertical}.tip{background:#fff3c6;border-left:5px solid #e8b82e;padding:12px;border-radius:8px;margin:12px 0}.feedback{min-height:30px;font-weight:900;margin:14px 0}.feedback.good{color:#187b58}.feedback.bad{color:var(--red)}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.listen{display:flex;align-items:center;gap:12px;background:#e6faf3;padding:14px;border-radius:16px;margin-bottom:18px}.draw{width:100%;height:300px;background:#fff;border:3px dashed #9d81d2;border-radius:16px;touch-action:none;cursor:crosshair}.results{text-align:center}.score{font-size:4rem;font-weight:900;color:var(--purple);margin:12px}.review{text-align:left;display:grid;gap:8px;margin:20px 0}.review div{background:#f4effc;border-radius:10px;padding:10px 14px}@media(max-width:600px){.options{grid-template-columns:1fr}.card{padding:20px 16px}.draw{height:240px}}
</style></head>
<body><main class="shell"><header class="top"><a class="back" href="../index.html">← Menú</a><span class="badge">Lenguaje · 1° básico</span></header><section class="card">
<div id="welcome" class="screen active hero"><div class="hero-icon">📚✨</div><p class="question-label">Evaluación de Lenguaje</p><h1 class="title">Evaluación<br>01 Sept</h1><p class="subtitle">Practica lectura, escritura y comprensión con todas las letras trabajadas hasta la G.</p><div class="sound-map"><span>Q: QUE · QUI</span><span>C: CA · CO · CU · CE · CI</span><span>G: GA · GO · GU · GUE · GUI · GE · GI</span></div><button class="btn" id="start">¡Comenzar!</button></div>
<div id="game" class="screen"><div class="progress-row"><span id="stepText">1 de 10</span><div class="track"><div id="fill" class="fill"></div></div><span id="stars">⭐ 0</span></div><p id="kind" class="question-label"></p><h2 id="prompt" class="prompt"></h2><div id="activity"></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="actions"><button class="btn secondary" id="clear" hidden>Limpiar dibujo</button><button class="btn" id="check">Comprobar</button><button class="btn" id="next" hidden>Siguiente →</button></div></div>
<div id="result" class="screen results"><div class="hero-icon">🏆</div><h1 class="title">¡Muy bien!</h1><p>Completaste la evaluación.</p><div id="score" class="score"></div><div id="review" class="review"></div><button class="btn" id="again">Jugar otra vez</button></div>
</section></main>
<script>
const exercises=[
{kind:'Letra y sonido',prompt:'¿Qué palabra corresponde a la imagen?',emoji:'🧀',options:['queso','caso','guiso','cena'],answer:'queso'},
{kind:'Letra y sonido',prompt:'Completa la palabra:  _itarra',emoji:'🎸',options:['gui','gue','gi','qui'],answer:'gui'},
{kind:'Letra y sonido',prompt:'¿Qué palabra comienza con el sonido CE?',options:['cebolla','casa','cuna','gato'],answer:'cebolla'},
{kind:'Relacionar',prompt:'Elige la oración que corresponde a la imagen.',emoji:'🐱🥛',options:['El gato toma leche.','La gata come queso.','Guillermo toca guitarra.','Cecilia mira el cielo.'],answer:'El gato toma leche.'},
{kind:'Ordenar una oración',prompt:'Ordena las palabras para formar una oración.',words:['come','Quique','queso'],answer:'Quique come queso.'},
{kind:'Escritura',prompt:'Escribe una oración sobre la imagen.',emoji:'🐢☀️',write:true,keywords:['tortuga'],hint:'Recuerda: mayúscula inicial, espacios y punto final.'},
{kind:'Comprensión lectora',prompt:'Lee: “Guillermo cuida a su gato. El gato se llama Coco.” ¿Cómo se llama el gato?',options:['Guillermo','Coco','Quique','Guga'],answer:'Coco'},
{kind:'Comprensión lectora',prompt:'Lee: “Cecilia come una cereza y guarda cinco para su amiga.” ¿Qué fruta come Cecilia?',options:['cereza','guinda','ciruela','queso'],answer:'cereza'},
{kind:'Comprensión auditiva',prompt:'Escucha el texto y responde: ¿Dónde juega Gina?',listen:'Gina juega con su amiga en el parque. Luego comen galletas.',options:['En el parque','En la casa','En el colegio','En el bosque'],answer:'En el parque'},
{kind:'Imaginar y representar',prompt:'Escucha y dibuja lo que imaginas.',listen:'Un gato pequeño duerme bajo una gran luna, junto a cinco flores.',draw:true}
];
let index=0,points=0,answered=false,results=[];const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}
function speak(text){if(!('speechSynthesis'in window)){setFeedback('Tu navegador no permite reproducir audio.',false);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-CL';u.rate=.78;speechSynthesis.speak(u)}
function render(){answered=false;const e=exercises[index];$('#stepText').textContent=`${index+1} de ${exercises.length}`;$('#fill').style.width=`${index/exercises.length*100}%`;$('#stars').textContent=`⭐ ${points}`;$('#kind').textContent=e.kind;$('#prompt').textContent=e.prompt;$('#feedback').textContent='';$('#feedback').className='feedback';$('#check').hidden=false;$('#next').hidden=true;$('#clear').hidden=!e.draw;let html=e.emoji?`<div class="picture" role="img" aria-label="Imagen del ejercicio">${e.emoji}</div>`:'';
if(e.listen)html+=`<div class="listen"><button class="btn secondary" type="button" id="listen">🔊 Escuchar</button><span>Puedes escucharlo más de una vez.</span></div>`;
if(e.options)html+=`<div class="options">${e.options.map(o=>`<button class="option" data-value="${o}">${o}</button>`).join('')}</div>`;
if(e.words)html+=`<div class="options">${e.words.map((w,i)=>`<button class="option word" data-value="${w}" data-i="${i}">${w}</button>`).join('')}</div><textarea class="writing" id="writing" aria-label="Tu oración" readonly></textarea><p class="tip">Usa mayúscula y punto final.</p>`;
if(e.write)html+=`<textarea class="writing" id="writing" placeholder="Escribe aquí tu oración…" aria-label="Tu oración"></textarea><p class="tip">${e.hint}</p>`;
if(e.draw)html+=`<canvas id="canvas" class="draw" aria-label="Zona para dibujar"></canvas><p class="tip">Dibuja los elementos que escuchaste. Esta actividad se completa al terminar tu dibujo.</p>`;
$('#activity').innerHTML=html;document.querySelectorAll('.option:not(.word)').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');b.style.borderColor='var(--purple)'});document.querySelectorAll('.word').forEach(b=>b.onclick=()=>{$('#writing').value+=($('#writing').value?' ':'')+b.dataset.value;b.disabled=true});if(e.listen)$('#listen').onclick=()=>speak(e.listen);if(e.draw)initCanvas()}
function initCanvas(){const c=$('#canvas'),ctx=c.getContext('2d'),ratio=devicePixelRatio||1;c.width=c.clientWidth*ratio;c.height=c.clientHeight*ratio;ctx.scale(ratio,ratio);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#7651c9';let down=false;const pos=ev=>{const r=c.getBoundingClientRect(),t=ev.touches?.[0]||ev;return[t.clientX-r.left,t.clientY-r.top]};c.onpointerdown=ev=>{down=true;ctx.beginPath();ctx.moveTo(...pos(ev));c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(down){ctx.lineTo(...pos(ev));ctx.stroke()}};c.onpointerup=()=>down=false;$('#clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
function normalize(s){return s.trim().toLocaleLowerCase('es').replace(/[.!¡¿?]/g,'').replace(/\s+/g,' ')}
function setFeedback(text,good){$('#feedback').textContent=text;$('#feedback').className=`feedback ${good?'good':'bad'}`}
function check(){if(answered)return;const e=exercises[index];let ok=false,attempt='';if(e.options){const b=$('.option.selected');if(!b){setFeedback('Elige una respuesta.',false);return}attempt=b.dataset.value;ok=attempt===e.answer;b.classList.add(ok?'correct':'wrong');if(!ok)[...document.querySelectorAll('.option')].find(x=>x.dataset.value===e.answer)?.classList.add('correct')}else if(e.words){attempt=$('#writing').value;if(!attempt){setFeedback('Ordena las palabras primero.',false);return}ok=normalize(attempt)===normalize(e.answer)}else if(e.write){attempt=$('#writing').value;const clean=attempt.trim();if(!clean){setFeedback('Escribe una oración primero.',false);return}ok=/^[A-ZÁÉÍÓÚÑ]/.test(clean)&&/[.]$/.test(clean)&&clean.includes(' ')&&e.keywords.some(k=>normalize(clean).includes(k));}else if(e.draw){attempt='Dibujo realizado';ok=true}answered=true;if(ok)points++;results.push({kind:e.kind,ok});setFeedback(ok?'¡Excelente! Respuesta completada.':'Revisa la respuesta correcta y sigue practicando.',ok);$('#stars').textContent=`⭐ ${points}`;$('#check').hidden=true;$('#next').hidden=false}
function next(){if(index<exercises.length-1){index++;render()}else finish()}function finish(){$('#fill').style.width='100%';show('result');$('#score').textContent=`${points} / ${exercises.length}`;$('#review').innerHTML=results.map(r=>`<div>${r.ok?'✅':'🌱'} <strong>${r.kind}</strong> — ${r.ok?'Logrado':'A seguir practicando'}</div>`).join('')}
$('#start').onclick=()=>{show('game');render()};$('#check').onclick=check;$('#next').onclick=next;$('#again').onclick=()=>{index=0;points=0;results=[];show('game');render()};
</script></body></html>
